name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reap
          POSTGRES_PASSWORD: reap
          POSTGRES_DB: reap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reap:reap@localhost:5432/reap
      TEST_DATABASE_URL: postgresql://reap:reap@localhost:5432/reap_test
      APP_URL: http://localhost:3000
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      CRON_SECRET: ci-cron-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=reap psql -h localhost -U reap -c "create database reap_test"
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Migrate & seed
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
